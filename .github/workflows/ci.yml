name: Manim CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenes:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install native rendering dependencies
        run: sudo python scripts/install_system_dependencies.py
      - name: Install the locked environment
        run: |
          python -m pip install -r requirements-tools.txt
          uv sync --locked --extra manim
      - name: Check the environment
        run: uv run --locked --extra manim animoz doctor
      - name: Test the numerical models and project configuration
        run: uv run --locked --extra manim python -m unittest discover -s tests -v
      - name: Render and verify all registered projects and camera presets
        run: uv run --locked --extra manim python scripts/render_examples.py --quality low --output artifacts
      - name: Attach MP4 previews and render records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-previews-python-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  container:
    name: Docker environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the same image used by Codespaces
        run: docker build --tag animoz-ci .
      - name: Check the container environment
        run: docker run --rm animoz-ci animoz doctor
      - name: Render a scene inside the container
        run: docker run --rm animoz-ci animoz render intro welcome --quality low

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-tools.txt
      - name: Audit all locked extras and transitive dependencies
        run: uv audit --locked --output-format json > dependency-audit.json
      - name: Attach the dependency audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14
