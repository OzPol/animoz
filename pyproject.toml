[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "animoz"
version = "0.1.0"
description = "A personal collection of mathematical, graphical, and experimental animations."
requires-python = ">=3.11.5"

[project.optional-dependencies]
manim = ["manim==0.22.1", "packaging>=25"]
notebooks = ["jupyter", "numpy", "matplotlib", "vpython"]

[project.scripts]
animoz = "animoz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"animoz" = ["runtime.toml"]
"animoz.projects.intro" = ["*.toml"]
"animoz.projects.puerta_court" = ["*.toml", "*.json", "*.csv", "*.html"]
"animoz.projects.systolic_array" = ["*.toml", "*.json", "*.csv"]

[tool.uv]
# Patched floor for the optional notebook dependency (GHSA-mmhr-3c5m-f64f).
constraint-dependencies = ["soupsieve>=4.0.0"]
